# Monitoring Stack: Prometheus + Grafana for vLLM inference servers
# This stack is independent and can run on a separate host from the main infrastructure
#
# Usage:
#   cd monitoring/
#   cp .env.example .env
#   # Edit .env with your values
#   docker compose up -d
#
# Access (via SSH tunnel from local machine):
#   ssh -L 9090:127.0.0.1:9090 user@<monitoring-host>  # Prometheus
#   ssh -L 3000:127.0.0.1:3000 user@<monitoring-host>  # Grafana
#

name: vllm-monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  # ====================================== Prometheus ======================================
  # Time-series database for metrics from vLLM servers and exporters
  # Scrapes metrics from:
  #   - vLLM servers (llm1 @ 10.75.9.21:8000, llm2 @ 10.75.9.22:8000/8001)
  #   - NVIDIA DCGM Exporter (llm1 & llm2 @ :9400)
  #   - Optional Node Exporter (system metrics @ :9100)
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v3.2.0}
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-127.0.0.1:9090}:9090"
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ====================================== Grafana ======================================
  # Visualization and dashboarding for Prometheus metrics
  # Dashboard auto-provisioned from dashboards/vllm-monitoring.json
  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-11.6.0}
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_INSTALL_PLUGINS: ""
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-127.0.0.1:3000}:3000"
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
