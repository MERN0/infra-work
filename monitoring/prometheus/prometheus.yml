global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: vllm-inference
    environment: production

# Alertmanager configuration (optional — uncomment when ready)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# NOTE on topology: this reflects the ACTUAL deployment as verified via
# `docker ps` + curl on both hosts (2026-09-07), not an assumed layout.
# llm1 = 10.75.9.21 (single full GPU), llm2 = 10.75.9.22 (MIG, 2x 29.48gb
# partitions). vLLM's own metrics use a COLON prefix (`vllm:...`), not an
# underscore — confirmed via `curl .../metrics | grep '^vllm:'` on both
# hosts. Grafana dashboard queries must match that naming.

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # ============================== llm1 (10.75.9.21) — full GPU, no MIG ==============================
  - job_name: vllm-llm1-gpt120b
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [10.75.9.21:8000]
        labels:
          server: llm1
          model: gpt-oss-120b
          instance_type: full_gpu

  - job_name: vllm-llm1-qwen3-embedding
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [10.75.9.21:8001]
        labels:
          server: llm1
          model: qwen3-embedding
          instance_type: full_gpu

  # dcgm-exporter on llm1 runs with --network host, so it's reachable
  # directly on the host's port 9400 (no docker port mapping shown).
  - job_name: nvidia-dcgm-llm1
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [10.75.9.21:9400]
        labels:
          server: llm1
          exporter: nvidia-dcgm

  # ============================== llm2 (10.75.9.22) — MIG, 2x partitions ==============================
  - job_name: vllm-llm2-gemma3-27b
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [10.75.9.22:8000]
        labels:
          server: llm2
          model: gemma-3-27b-it
          instance_type: mig_instance

  - job_name: vllm-llm2-bge-m3
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [10.75.9.22:8001]
        labels:
          server: llm2
          model: bge-m3
          instance_type: mig_instance

  - job_name: vllm-llm2-bge-reranker
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [10.75.9.22:8002]
        labels:
          server: llm2
          model: bge-reranker
          instance_type: mig_instance

  - job_name: vllm-llm2-nemotron-nano-mig
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [10.75.9.22:8005]
        labels:
          server: llm2
          model: nemotron-nano-12b-v2
          instance_type: mig_instance

  # dcgm-exporter on llm2 also runs with --network host (port 9400).
  # Exposes MIG-specific series with GPU_I_ID / GPU_I_PROFILE labels
  # (confirmed: GPU_I_PROFILE="29.48gb", GPU_I_ID="1" and "2").
  - job_name: nvidia-dcgm-llm2
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [10.75.9.22:9400]
        labels:
          server: llm2
          exporter: nvidia-dcgm

  # ============================== Excluded from this stack ==============================
  # mahendari-safety-security-dev (llm2:11434) is an Ollama-based service, not vLLM —
  # different metrics format (Ollama has no native /metrics endpoint as far as we've
  # verified). Add a scrape job here only after confirming it actually exports
  # Prometheus-format metrics; don't assume.

  # Optional: Node Exporter for system metrics (CPU, memory, disk) — not yet deployed
  # on either host. Uncomment and adjust if you add node-exporter later.
  # - job_name: node-llm1
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: [10.75.9.21:9100]
  #       labels:
  #         server: llm1
  #         exporter: node
  # - job_name: node-llm2
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: [10.75.9.22:9100]
  #       labels:
  #         server: llm2
  #         exporter: node
